name: Deploy to VM

on:
  workflow_run:
    workflows: ['Docker Image CI']
    types:
      - completed
    branches:
      - main

  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VM_KEY }}

      - name: Add remote server to known_hosts
        run: |
          ssh-keyscan ${{ secrets.VM_HOST }} >> ~/.ssh/known_hosts

      - name: Copy docker-compose.prod.yml to VM
        run: |
          scp docker-compose.prod.yml \
              ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}:~/projects/conduit/docker-compose.yml

      - name: Pull new images and restart containers
        run: |
          ssh ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} << 'ENDSSH'
            set -e
            cd ~/projects/conduit
            touch .env
            echo "${{ secrets.ENV_FILE }}" >> .env
            echo "${{ secrets.VM_GHCR_TOKEN }}" | \
              docker login ghcr.io -u ${{ secrets.VM_USER }} --password-stdin
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
          ENDSSH
