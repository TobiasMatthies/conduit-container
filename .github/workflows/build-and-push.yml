name: Docker Image CI

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Convert repo name to lowercase
        id: lowercase
        run: echo "image_prefix=ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]' >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/frontend/frontend.Dockerfile
          push: true
          tags: |
            ${{ env.image_prefix }}/conduit-frontend:latest
            ${{ env.image_prefix }}/conduit-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/backend/backend.Dockerfile
          push: true
          tags: |
            ${{ env.image_prefix }}/conduit-backend:latest
            ${{ env.image_prefix }}/conduit-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
