name: Docker Image CI

on:
  push:
    branches: [ "main" ]

  workflow_dispatch:
  
env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}
 
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
 
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
 
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
 
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
 
      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/frontend/frontend.Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/conduit-frontend:latest
            ${{ env.IMAGE_PREFIX }}/conduit-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
 
      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/backend/backend.Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/conduit-backend:latest
            ${{ env.IMAGE_PREFIX }}/conduit-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
