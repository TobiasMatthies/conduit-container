services:
  db:
    image: postgres:18.4
    container_name: conduit_database
    env_file:
      - .env
    volumes:
      - conduit_data:/var/lib/postgresql

  frontend:
    build:
      context: .
      dockerfile: ./docker/frontend/frontend.Dockerfile

    ports:
      - '${CONDUIT_FE_PORT}:8080'

    environment:
      - API_URL=${API_URL}

    volumes:
      - conduit_staticfiles:/usr/share/nginx/html/static
      - conduit_mediafiles:/usr/share/nginx/html/media

    depends_on:
      - backend

  backend:
    build:
      context: .
      dockerfile: ./docker/backend/backend.Dockerfile

    env_file:
      - .env

    expose:
      - '8000'

    volumes:
      - conduit_staticfiles:/static
      - conduit_mediafiles:/media

    depends_on:
      - db

volumes:
  conduit_data:
  conduit_staticfiles:
  conduit_mediafiles:
