services:
  db:
    image: postgres:latest
    container_name: conduit_database
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - conduit_data:/var/lib/postgresql

  frontend:
    build:
      context: .
      dockerfile: ./docker/frontend/frontend.Dockerfile

    ports:
      - '4200:4200'

  backend:
    build:
      context: .
      dockerfile: ./docker/backend/backend.Dockerfile

    env_file: .env

    ports:
      - '8000:8000'

    depends_on:
      - db

volumes:
  conduit_data:
